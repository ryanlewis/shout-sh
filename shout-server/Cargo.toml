[package]
name = "shout-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "shout_server"
path = "src/lib.rs"

[[bin]]
name = "shout-server"
path = "src/main.rs"

[dependencies]
shout-core = { path = "../shout-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde_json = "1"
async-stream = "0.3"
futures-core = "0.3"
prometheus = { version = "0.14", default-features = false, features = ["process"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
