name: Security audit

on:
  schedule:
    - cron: '0 7 * * 1' # advisories move without commits; re-check weekly
  push:
    branches: [main]
    paths: ['Cargo.lock', 'Cargo.toml', 'deny.toml', '.github/workflows/audit.yml']
  pull_request:
    branches: [main]
    paths: ['Cargo.lock', 'Cargo.toml', 'deny.toml', '.github/workflows/audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories sources
