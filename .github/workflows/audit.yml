name: Security audit

on:
  schedule:
    - cron: '0 7 * * 1' # advisories move without commits; re-check weekly
  push:
    branches: [main]
    paths: ['Cargo.lock', 'Cargo.toml', 'deny.toml', '.github/workflows/audit.yml']
  pull_request:
    branches: [main]
    paths: ['Cargo.lock', 'Cargo.toml', 'deny.toml', '.github/workflows/audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories sources
