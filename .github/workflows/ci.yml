name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded PR runs are cancelled. Runs on main queue instead, so a new
# push never kills a deploy half way through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=crate depName=worker-build
  WORKER_BUILD_VERSION: 0.8.6

jobs:
  ci:
    name: just ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # version comes from web/package.json's hash-pinned packageManager field
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          run_install: false

      - name: install just
        env:
          # renovate: datasource=github-releases depName=casey/just
          JUST_VERSION: 1.58.0
        run: |
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin just

      - name: install wasm-pack
        env:
          # renovate: datasource=github-releases depName=rustwasm/wasm-pack
          WASM_PACK_VERSION: v0.15.0
        run: |
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin \
                "wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"

      - name: install worker-build
        run: cargo install worker-build --version "=${WORKER_BUILD_VERSION}" --locked

      - run: just ci

      # web/ deps are installed by `just ci` (web-build).
      - name: check web formatting
        working-directory: web
        run: pnpm format:check

      # Runs wrangler dev on localhost with no secrets and no Cloudflare
      # login. `just ci` has already built web/dist and the Worker and
      # installed wrangler with --ignore-scripts.
      - name: smoke test
        timeout-minutes: 5
        run: just smoke

      # The deploy job ships exactly what was built and tested here. It never
      # runs the build toolchain, so nothing the build ran (build scripts,
      # proc macros, worker-build's downloads) shares a runner with the token.
      - name: upload worker bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-bundle
          path: |
            shout-worker/build/
            web/dist/
          if-no-files-found: error
          retention-days: 1

  # Checks the workspace with the oldest Rust it declares, so rust-version in
  # Cargo.toml stays true. The toolchain is read from that file, so a bump
  # there is what this job checks. The Worker glue and the browser wasm only
  # compile for wasm32, so that target is checked as well as the host.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: read rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no rust-version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - run: cargo check --workspace --all-targets --locked

      - name: cargo check (wasm32)
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo check -p shout-worker -p shout-wasm --target wasm32-unknown-unknown --locked

  # Deploys main to Cloudflare once CI passes. The `production` environment
  # holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and only admits
  # main. Without the token the job skips the upload, so forks and a fresh
  # setup stay green.
  deploy:
    name: deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # For wrangler.toml and the wrangler lockfile only; nothing is built.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shout-worker/package.json
          run_install: false

      # No secrets in env for the install. No install scripts run.
      - name: install wrangler
        working-directory: shout-worker
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-bundle
          path: .

      - name: deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        working-directory: shout-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The empty env is the top level of wrangler.toml: production.
        # Naming it stops wrangler warning that other envs exist.
        run: ./node_modules/.bin/wrangler deploy --env ""

      - name: note skipped deploy
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipped wrangler deploy."
