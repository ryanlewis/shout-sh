[package]
name = "shout-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cloudflare Worker that serves shout.sh."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shout-core = { path = "../shout-core" }
percent-encoding = "=2.3.2"
serde_json = "=1.0.154"
# Keyed hash of the client key that names its StreamSlots object. See
# slots::object_name.
hmac = "=0.13.0"
sha2 = "=0.11.1"

# The Worker glue only builds for wasm32. Everything else in this crate is
# plain Rust, so `cargo test --all` covers routing and stream framing on
# the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.9.0"
futures-util = { version = "=0.3.34", default-features = false }
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
