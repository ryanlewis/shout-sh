# The name is historical. This Worker used to proxy shout.sh to a VM.
# Deploying under the same name replaces it in place: the routes stay and
# no DNS change is needed. `wrangler rollback` cannot return to the proxy
# or any version before the StreamSlots migration below.
name = "shout-sh-proxy"
# Built by `just worker-build`, not by wrangler. There is no [build]
# command on purpose: `wrangler deploy` in CI holds the Cloudflare token,
# and the Rust build (build scripts, proc macros) must not run with it.
main = "build/index.js"
compatibility_date = "2026-09-18"
# Aborts request.signal when the client disconnects, which ends the
# animation stream. See disconnected() in src/glue.rs.
compatibility_flags = ["enable_request_signal"]
workers_dev = false

routes = [
  { pattern = "shout.sh/*", zone_name = "shout.sh" },
  { pattern = "www.shout.sh/*", zone_name = "shout.sh" },
]

# web/dist from `just web-build`. The Worker runs first on every request
# so it can pick HTML or plain text on /, /about and /privacy; it fetches
# files through the ASSETS binding and sets the cache headers itself.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# One data point per request. See src/event.rs for the column layout.
[[analytics_engine_datasets]]
binding = "SHOUT_EVENTS"
dataset = "shout_events"

# Per-client rate limits, keyed on the client IP (an IPv6 /64). See
# app::plan for which requests count against which limit. GET and HEAD
# on the health check, /_app/*, /favicon.* and /og.png are exempt. Every
# other method, on any path, counts against RATE_LIMIT and never against
# STREAM_LIMIT: under the limit it gets a 405, over it the usual 429.
#
# Counters are per Cloudflare location and eventually consistent, so the
# limits are approximate. They stop one client flooding the service, not
# a client using it. Keep `period = 60`: app::RETRY_AFTER assumes it.
# namespace_id only has to be unique within the Cloudflare account.
#
# General: 30 requests a minute. A person trying fonts by hand sends a
# few a minute. A shell loop over the 13 fonts is 13 requests, so it
# fits. Loading the playground page costs 1: it renders in the browser,
# and /_app/* is exempt. The counts are per Cloudflare location, so a
# client can sometimes get a little more than 30.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "7001"
simple = { limit = 30, period = 60 }

# Animation streams: 5 a minute. A person trying out animations starts
# a few and stops each with Ctrl-C. Each stream holds a connection for
# up to 300s and sends up to 64MB (see src/stream.rs), so this is what
# bounds a client's streaming cost. Like the general limit, the count is
# per Cloudflare location and approximate.
#
# scripts/smoke.sh runs wrangler dev on a copy of this file with other
# limits, and checks that this file still has 30 and 5. Change both
# together.
[[ratelimits]]
name = "STREAM_LIMIT"
namespace_id = "7002"
simple = { limit = 5, period = 60 }

# Open animation streams per client: at most slots::MAX_STREAMS (3) at
# once. STREAM_LIMIT above counts new streams a minute, but a stream can
# stay open for 300s, so a client could still hold many at once. One
# StreamSlots object per client holds its leases: slot ids and expiry
# times only. The object's name is HMAC-SHA256 of the rate-limit key
# under the SLOT_KEY_SECRET secret, never the address. Without that
# secret the cap is off. See src/slots.rs and src/glue.rs.
[[durable_objects.bindings]]
name = "STREAM_SLOTS"
class_name = "StreamSlots"

# Creates the StreamSlots namespace, SQLite-backed. Never edit or remove a
# migration once deployed; a later change adds a new tag. `wrangler
# rollback` cannot go back past this migration.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamSlots"]

# CPU time, not wall time: waiting between frames is free. The heaviest
# stream the parser accepts is 3d + rainbow, ls=10, pad=10 and 200 wide
# characters: 5.7ms and 1.36MB per frame (measured on an Apple M-series
# core, wasm in V8), so 30fps for 300s is about 52s. 120s lets it finish
# on slower server cores and still caps what one request can cost.
# Typical streams use well under 1s. Needs the Workers Paid plan.
[limits]
cpu_ms = 120000
