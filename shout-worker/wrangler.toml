# The name is historical. This Worker used to proxy shout.sh to a VM.
# Deploying under the same name replaces it in place: the routes stay, no
# DNS change is needed, and `wrangler rollback` returns to the proxy.
name = "shout-sh-proxy"
# Built by `just worker-build`, not by wrangler. There is no [build]
# command on purpose: `wrangler deploy` in CI holds the Cloudflare token,
# and the Rust build (build scripts, proc macros) must not run with it.
main = "build/index.js"
compatibility_date = "2026-09-18"
# Aborts request.signal when the client disconnects, which ends the
# animation stream. See disconnected() in src/glue.rs.
compatibility_flags = ["enable_request_signal"]
workers_dev = false

routes = [
  { pattern = "shout.sh/*", zone_name = "shout.sh" },
  { pattern = "www.shout.sh/*", zone_name = "shout.sh" },
]

# web/dist from `just web-build`. The Worker runs first on every request
# so it can pick HTML or plain text on /, /about and /privacy; it fetches
# files through the ASSETS binding and sets the cache headers itself.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# One data point per request. See src/event.rs for the column layout.
[[analytics_engine_datasets]]
binding = "SHOUT_EVENTS"
dataset = "shout_events"

# CPU time, not wall time: waiting between frames is free. The heaviest
# stream the parser accepts is 3d + rainbow, ls=10, pad=10 and 200 wide
# characters: 5.7ms and 1.36MB per frame (measured on an Apple M-series
# core, wasm in V8), so 30fps for 300s is about 52s. 120s lets it finish
# on slower server cores and still caps what one request can cost.
# Typical streams use well under 1s. Needs the Workers Paid plan.
[limits]
cpu_ms = 120000
