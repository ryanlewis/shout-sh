# Only resolve package versions published at least 7 days ago, so a
# compromised release has time to be pulled before it lands here.
# pnpm 11 defaults to 1 day; 10080 min matches the npm-side posture
# (min-release-age in ~/.npmrc). Frozen-lockfile CI installs are
# unaffected — this gates resolution, not fetching.
minimumReleaseAge: 10080

# Exemptions where the younger version IS the security fix (remove once aged past 7d):
minimumReleaseAgeExclude:
  - js-yaml@4.3.1 # GHSA-5p4m-2wfm-xmqj !!omap backport, published 2026-07-31
  # Renovate security update: pnpm@11.8.0
  - pnpm@11.8.0

allowBuilds:
  # esbuild works without its postinstall — the binary ships via the
  # @esbuild/* platform optionalDependencies, which have no scripts.
  # Denying keeps installs script-free; pnpm 11 errors without a verdict here.
  esbuild: false
