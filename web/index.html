<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>shout.sh — render sexy text in your terminal</title>
		<meta name="description" content="Renders sexy text in your terminal. curl shout.sh/HELLO — no flags, no config, just a URL." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://shout.sh/" />
		<meta property="og:title" content="shout.sh — render sexy text in your terminal" />
		<meta property="og:description" content="Renders sexy text in your terminal. curl shout.sh/HELLO — no flags, no config, just a URL." />
		<meta property="og:image" content="https://shout.sh/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="shout.sh — render sexy text in your terminal" />
		<meta name="twitter:description" content="Renders sexy text in your terminal. curl shout.sh/HELLO — no flags, no config, just a URL." />
		<meta name="twitter:image" content="https://shout.sh/og.png" />
		<link rel="stylesheet" href="/_app/main.css" />
		<script defer src="https://analytics.rlew.io/script.js" data-website-id="262c65da-7557-48e8-b1ea-6638d3bb6f8c"></script>
	</head>
	<body>
		<div id="app">
			<div class="container">
				<header class="masthead">
					<pre class="masthead__art" aria-label="shout.sh">
 █▀▀ █ █ █▀█ █ █ ▀█▀   █▀▀ █ █
 ▄▄█ █▀█ █▄█ █▄█  █  ▄ ▄▄█ █▀█</pre>
				</header>

				<section class="playground">
					<div class="prompt-line" role="group" aria-label="text input">
						<span class="ps1">$ curl shout.sh/</span>
						<input
							id="text-in"
							class="text-in"
							type="text"
							spellcheck="false"
							autocapitalize="off"
							autocomplete="off"
							value="hello|world"
							maxlength="40"
							aria-label="banner text"
						/>
					</div>

					<div class="controls">
						<div class="opt">
							<span class="opt__label">FONT</span>
							<div
								id="font-picker"
								class="chips"
								role="radiogroup"
								aria-label="font"
							></div>
						</div>
						<div class="opt">
							<span class="opt__label">PALETTE</span>
							<div
								id="preset-picker"
								class="chips"
								role="radiogroup"
								aria-label="palette"
							></div>
						</div>
						<div class="opt">
							<span class="opt__label">MODE</span>
							<div id="mode-picker" class="chips" role="radiogroup" aria-label="mode">
								<button
									type="button"
									role="radio"
									data-mode="solid"
									aria-checked="true"
								>
									solid
								</button>
								<button type="button" role="radio" data-mode="rainbow">rainbow</button>
								<button type="button" role="radio" data-mode="fire">fire</button>
							</div>
						</div>
						<div class="opt">
							<input id="once-cb" type="checkbox" />
							<label for="once-cb" class="check"
								><span class="check__box">[ ]</span
								><span>once (static)</span></label
							>
						</div>
						<div class="opt opt--fps">
							<label class="opt__label" for="fps-in">FPS</label>
							<input id="fps-in" type="range" min="1" max="30" value="10" />
							<span id="fps-val" class="fps-val">10</span>
						</div>
					</div>

					<details class="adv">
						<summary class="adv__summary">
							<span class="adv__caret" aria-hidden="true"></span>advanced options
						</summary>
						<div class="adv__body">
							<div class="opt opt--num">
								<label class="opt__label" for="ls-in">LETTER&nbsp;SPACING</label>
								<input id="ls-in" type="range" min="0" max="10" value="1" />
								<span id="ls-val" class="fps-val">1</span>
							</div>
							<div class="opt opt--num">
								<label class="opt__label" for="pad-in">PADDING</label>
								<input id="pad-in" type="range" min="0" max="10" value="2" />
								<span id="pad-val" class="fps-val">2</span>
							</div>
							<div class="opt opt--num">
								<label class="opt__label" for="ml-in">MAX&nbsp;LENGTH</label>
								<input id="ml-in" type="number" min="0" max="200" step="1" value="0" class="num-in" />
								<span class="hint">0 = no limit</span>
							</div>
							<div class="opt">
								<label class="opt__label" for="bg-in">BACKGROUND</label>
								<select id="bg-in" class="select-in">
									<option value="">transparent</option>
									<option value="black">black</option>
									<option value="red">red</option>
									<option value="green">green</option>
									<option value="yellow">yellow</option>
									<option value="blue">blue</option>
									<option value="magenta">magenta</option>
									<option value="cyan">cyan</option>
									<option value="white">white</option>
									<option value="gray">gray</option>
									<option value="redbright">red bright</option>
									<option value="greenbright">green bright</option>
									<option value="yellowbright">yellow bright</option>
									<option value="bluebright">blue bright</option>
									<option value="magentabright">magenta bright</option>
									<option value="cyanbright">cyan bright</option>
									<option value="whitebright">white bright</option>
								</select>
							</div>
						</div>
					</details>

					<div class="frame" aria-live="polite" aria-busy="true">
						<div class="term-prompt"><span class="ps" aria-hidden="true">guest@shout:~$&nbsp;</span><span id="term-cmd">curl shout.sh/rainbow/HELLO</span></div>
						<pre id="frame" class="shout-frame loading">loading playground…</pre>
					</div>

					<div class="curl" role="group" aria-label="curl command">
						<span id="curl-cmd" class="prompt">curl shout.sh/</span>
						<button
							id="copy-btn"
							class="btn-ascii"
							type="button"
							aria-label="copy curl command"
						>
							[ copy ]
						</button>
					</div>
					<div id="log" class="log" aria-live="polite"></div>
				</section>

				<footer class="foot">
					<p class="muted">
						<a href="/about">about</a> ·
						<a href="/privacy">privacy</a> ·
						<a href="https://github.com/ryanlewis/shout-sh">github</a>
					</p>
				</footer>
			</div>
		</div>
		<script type="module" src="/_app/main.js"></script>
	</body>
</html>
