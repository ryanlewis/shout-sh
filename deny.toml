# cargo-deny config — security checks only (advisories + sources).
# Licenses/bans deliberately not policed; run `cargo deny check advisories sources`.

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# cfonts v4 is unreleased and pinned to a git rev (see Cargo.toml).
allow-git = ["https://github.com/dominikwilkowski/cfonts"]
