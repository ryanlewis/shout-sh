[workspace]
resolver = "2"
members = ["shout-core", "shout-wasm", "shout-worker"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Tiny HTTP server that renders stylized ASCII banners over curl."
repository = "https://github.com/ryanlewis/shout-sh"
homepage = "https://shout.sh"
readme = "README.md"

[workspace.dependencies]
# cfonts v4 is unreleased: pinned to the head of upstream PR #90 (branch v4).
# Do not merge until v4 is published to crates.io.
cfonts = { git = "https://github.com/dominikwilkowski/cfonts", rev = "bec40fa3428d9576bb3fe1ef07e885e8d6d26f9b" }

# wasm release profile — shipped to the browser, optimize for size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
